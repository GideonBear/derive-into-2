[package]
name = "derive-into-2-macros"
version = "0.3.0"
edition = "2024"
description = "Proc-macro implementation for derive-into"
repository = "https://github.com/GideonBear/derive-into-2"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0.52", features = ["full"] }
quote = "1"
proc-macro2 = "1"
darling = "0.24.0"
indexmap = { version = "2.14.2", optional = true }

[features]
indexmap = ["dep:indexmap"]
