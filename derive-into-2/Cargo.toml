[package]
name = "derive-into-2"
version = "0.3.0"
edition = "2024"
description = "A Rust derive macro for easily creating conversions between structs and enums"
readme = "../README.md"
repository = "https://github.com/GideonBear/derive-into-2"
license = "MIT"
keywords = ["derive", "convert", "macro", "into", "from"]
categories = ["development-tools", "rust-patterns"]
documentation = "https://docs.rs/derive-into-2"

[dependencies]
derive-into-2-macros = { path = "../derive-into-2-macros", version = "0.3.0" }
derive-into-2-error = { path = "../derive-into-2-error", version = "0.3.0" }

[dev-dependencies]
trybuild = "1.0"
indexmap = { version = "2.14.2" }
derive-into-2-macros = { path = "../derive-into-2-macros", version = "0.3.0", features = ["indexmap"] }

[features]
indexmap = ["derive-into-2-macros/indexmap"]
